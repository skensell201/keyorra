[workspace]
members = ["crates/keepsake-core", "crates/keepsake-session", "app/src-tauri"]
default-members = ["crates/keepsake-core", "crates/keepsake-session"]
resolver = "2"

# Argon2 with 64 MiB is painfully slow unoptimized; keep debug builds usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
