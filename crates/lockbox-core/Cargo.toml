[package]
name = "lockbox-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
csv = "1"
data-encoding = "2"
hmac = "0.12"
percent-encoding = "2"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
zxcvbn = "3"

[dev-dependencies]
mockito = "1"
tempfile = "3"
