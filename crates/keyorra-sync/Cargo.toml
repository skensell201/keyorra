[package]
name = "keyorra-sync"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Keyorra sync: wire formats and (later) the sync engine. Pure: no I/O, no OS APIs."

[dependencies]
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["zeroize"] }
hkdf = "0.12"
keyorra-core = { path = "../keyorra-core" }
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v8"] }
zeroize = "1"

[features]
# Exposes the fault-injecting transport and the simulated cluster to other crates' tests.
test-utils = ["keyorra-core/test-utils"]

[dev-dependencies]
keyorra-core = { path = "../keyorra-core", features = ["test-utils"] }
proptest = "1"
