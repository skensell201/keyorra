[package]
name = "lockbox-session"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
lockbox-core = { path = "../lockbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
lockbox-core = { path = "../lockbox-core", features = ["test-utils"] }
tempfile = "3"
