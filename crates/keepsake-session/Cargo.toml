[package]
name = "keepsake-session"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
chacha20poly1305 = "0.10"
data-encoding = "2"
keepsake-core = { path = "../keepsake-core" }
psl = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
keepsake-core = { path = "../keepsake-core", features = ["test-utils"] }
tempfile = "3"
